<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftelklok Politie</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #002B5C, #005BBB);
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
        text-align: center;
    }

    #logo {
        width: 180px;
        margin-bottom: 30px;
    }

    h1 {
        font-size: 2.5vw;
        margin-bottom: 40px;
    }

    #countdown {
        font-size: 4.5vw;
        font-weight: bold;
        margin-bottom: 30px;
    }

    #hoursSpecial {
        font-size: 2vw;
        opacity: 0.9;
    }

    #fullscreenBtn {
        position: absolute;
        bottom: 20px;
        padding: 10px 20px;
        border: none;
        background: white;
        color: #002B5C;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
    }

    #fullscreenBtn:hover {
        opacity: 0.8;
    }
</style>
</head>

<body>

<img id="logo" src="politielogo.png" alt="Politie Logo">

<h1>Aftellen naar vrijdag 20 februari 2026 - 12:00 uur</h1>

<div id="countdown">Laden...</div>
<div id="hoursSpecial"></div>

<button id="fullscreenBtn" onclick="openFullscreen()">Fullscreen</button>

<script>
    const targetDate = new Date(2026, 1, 20, 12, 0, 0).getTime();
    const countdownElement = document.getElementById("countdown");
    const hoursSpecialElement = document.getElementById("hoursSpecial");

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            countdownElement.innerHTML = "🎉 Het is zover!";
            hoursSpecialElement.innerHTML = "";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Totaal aantal uren (met decimalen)
        const totalHours = (distance / (1000 * 60 * 60)).toFixed(2);

        countdownElement.innerHTML =
            days + " dagen " +
            hours + " uur " +
            minutes + " minuten " +
            seconds + " seconden";

        hoursSpecialElement.innerHTML =
            "Voor Quentin speciaal in uren: <strong>" +
            totalHours +
            " uur</strong>";
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function openFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        }
    }

    window.onload = function() {
        setTimeout(() => {
            openFullscreen();
        }, 500);
    };
</script>

</body>
</html>
